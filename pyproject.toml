[project]
name = "optimization-course"
version = "0.1.0"
description = "A crash course on practical optimization for autonomous systems"
authors = [
    {name = "Alex Paskal",email = "alexcpaskal@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "cvxpy (>=1.8.1,<2.0.0)",
    "casadi (>=3.7.2,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
